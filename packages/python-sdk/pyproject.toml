[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrace-py"
version = "0.1.2"
description = "Deterministic execution, flight recorder, and replay layer for AI Agents"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "AgentTrace", email = "hello@agenttrace.com" }
]
keywords = [
    "ai",
    "agent",
    "determinism",
    "replay",
    "debugging",
    "telemetry",
    "langchain",
    "openai",
    "flight-recorder"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "requests>=2.25.0",
    "urllib3>=1.26.0",
    "typing-extensions>=4.0.0"
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.1.0"
]
openai = [
    "openai>=1.0.0"
]
all = [
    "langchain-core>=0.1.0",
    "openai>=1.0.0"
]
test = [
    "pytest>=7.0.0"
]

[project.urls]
Homepage = "https://agenttrace.com"
Documentation = "https://agenttrace.com/docs"
Repository = "https://github.com/nirbhaysagar/agenttrace"
Issues = "https://github.com/nirbhaysagar/agenttrace/issues"

[project.scripts]
agenttrace = "agenttrace.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agenttrace*"]
